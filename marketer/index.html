<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAAJL | عداد المسوّقة</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#e6fbfd 0%,#ffffff 36%,#effbfc 100%);color:#123c49;font-family:system-ui,Tahoma,Arial,sans-serif;line-height:1.6}main{max-width:680px;margin:22px auto;padding:16px}.hero{background:linear-gradient(125deg,#5be5e8,#0786aa);color:white;padding:24px;border-radius:20px}.hero h1{margin:0;font-size:28px}.hero p{margin:5px 0 0;color:#ffffff}.panel{background:white;border-radius:18px;padding:20px;margin-top:14px;box-shadow:0 6px 24px #0b87951c}.field{margin:18px 0}.field label{display:flex;justify-content:space-between;gap:10px;font-weight:700}.field input[type=range]{width:100%;accent-color:#0799b4;margin:10px 0}.field input[type=text]{width:100%;padding:12px;border:1px solid #b6e4eb;border-radius:10px;font-size:16px}.total{background:#e2f9fb;padding:18px;border-radius:14px;margin:15px 0}.total strong{font-size:32px;color:#087e9f;display:block}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #e1f0f3}td:last-child{text-align:left;direction:ltr}button{width:100%;background:#087e9f;color:white;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:17px;cursor:pointer}small{color:#52737b}a{color:#087e9f}</style></head><body><main><div style="background:#fff;border-radius:20px;text-align:center;padding:12px;margin-bottom:12px"><img src="../assets/zaajl-official-logo.svg" alt="ZAAJL FOR EVERY MOVE" style="width:min(280px,85%);height:auto;display:inline-block"></div><div class="hero"><div style="font-size:13px;letter-spacing:2px;font-weight:800;color:#fff;margin-bottom:6px">ZAAJL · FOR EVERY MOVE</div><h1>عداد المسوّقة</h1><p>حاسبة تفاعلية للحوافز  خلال حملة الإطلاق</p></div><section class="panel"><div class="field"><label for="person">الاسم</label><input id="person" type="text" placeholder="اكتب الاسم (اختياري)"></div>
<div class="field"><label for="days"><span>أيام العمل</span><output id="daysOut">6</output></label><input id="days" type="range" min="0" max="7" value="6" step="1"></div>
<div class="field"><label for="refs"><span>الإحالات الناجحة</span><output id="refsOut">10</output></label><input id="refs" type="range" min="0" max="60" value="10" step="1"></div>
<div class="total">الإجمالي التقديري بالدولار<strong id="total">$0.00</strong></div><table><tbody><tr><td>بدل أيام العمل</td><td id="base">$0.00</td></tr><tr><td>مكافآت الإحالات</td><td id="bonus">$0.00</td></tr></tbody></table><p><button id="copy" type="button">نسخ الحساب</button></p><p id="notice" aria-live="polite"></p><small>سعر الصرف الافتراضي: 89,500 ل.ل. لكل دولار. الإحالة الناجحة تتطلب أول رحلة مدفوعة. بدل النشاط 3 دولارات لكل يوم مؤهل.</small></section><p><a href="./">العودة إلى الرئيسية</a></p></main><script>
(function(){'use strict';const ids=["days","refs"];const el=id=>document.getElementById(id);const v=id=>Number(el(id).value);const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});let summary='';function calculate(){ids.forEach(id=>el(id+'Out').textContent=v(id).toLocaleString('en-US'));const base=v('days')*3,bonus=v('refs'),rides=0,total=base+bonus+rides;el('base').textContent=money(base);el('bonus').textContent=money(bonus);el('total').textContent=money(total);summary='ZAAJL — عداد المسوّقة\nالاسم: '+(el('person').value||'—')+'\nأيام العمل: '+v('days')+'\nالإحالات الناجحة: '+v('refs')+'\nبدل العمل: '+money(base)+'\nمكافآت الإحالات: '+money(bonus)+'\nالإجمالي: '+money(total)}ids.forEach(id=>el(id).addEventListener('input',calculate));el('person').addEventListener('input',calculate);el('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(summary);el('notice').textContent='تم نسخ الحساب';}catch(e){const t=document.createElement('textarea');t.value=summary;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();el('notice').textContent=ok?'تم نسخ الحساب':'تعذّر النسخ؛ جرّب متصفح Chrome أو Safari';}});calculate();})();
</script></body></html>
